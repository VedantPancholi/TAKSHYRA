# Reference for the M4 seeded demo contract. The authoritative seed is takshyra/contracts.py.
# POST /api/v1/contracts/{dataset_id}/versions accepts this shape as JSON.
schema_fields:
  - {name: order_id, type: string, required: true}
  - {name: order_ts, type: timestamp, required: true}
  - {name: amount, type: decimal, required: true}
  - {name: customer_id, type: string, required: true}
allow_extra_fields: false
expected_row_count: 4
min_row_ratio: 0.95
max_customer_null_rate: 0.0
max_duplicate_rate: 0.0
max_age_hours: null
